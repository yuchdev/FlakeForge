name: CI

on:
  push:
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run tests
        run: pytest --cov=flakeforge --cov-report=term-missing
      - name: Run Ruff
        run: ruff check .
      - name: Run flakeforge self-check subset
        run: python -m flakeforge check --select X001,X009,X010 src
      - name: Build package
        run: python -m build

  wheel-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m build
      - name: Smoke test built wheel
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python -m venv "$tmpdir/venv"
          "$tmpdir/venv/bin/pip" install --upgrade pip
          "$tmpdir/venv/bin/pip" install dist/*.whl flake8
          # The wheel filename carries the built version: flakeforge-<version>-py3-none-any.whl.
          wheel_version="$(basename dist/*.whl | cut -d- -f2)"
          "$tmpdir/venv/bin/flakeforge" --version | grep -Fx "flakeforge $wheel_version"

          mkdir -p \
            "$tmpdir/clean" \
            "$tmpdir/bad" \
            "$tmpdir/custom/my_project" \
            "$tmpdir/provider_pkg/provider_rules"
          cat > "$tmpdir/clean/example.py" <<'PY'
          def documented() -> int:
              """Return a number."""
              return 1
          PY
          "$tmpdir/venv/bin/flakeforge" check "$tmpdir/clean/example.py"

          cat > "$tmpdir/bad/example.py" <<'PY'
          def handler():
              return 1
          PY
          set +e
          "$tmpdir/venv/bin/flakeforge" check "$tmpdir/bad/example.py"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected lint violations exit code 1, got $status" >&2
            exit 1
          fi

          cat > "$tmpdir/bad/flakeforge.toml" <<'TOML'
          select = ["X999"]
          TOML
          set +e
          "$tmpdir/venv/bin/flakeforge" check --config "$tmpdir/bad/flakeforge.toml" "$tmpdir/bad/example.py"
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected invalid-config exit code 2, got $status" >&2
            exit 1
          fi

          cat > "$tmpdir/custom/my_project/__init__.py" <<'PY'
          PY
          cat > "$tmpdir/custom/my_project/lint_rules.py" <<'PY'
          import ast
          from flakeforge import RuleContext, RuleRegistry, RuleViolation

          class NoPrintRule:
              code = "ACME001"
              description = "Do not call print() in production code."

              def check(self, context: RuleContext):
                  for node in ast.walk(context.tree):
                      if (
                          isinstance(node, ast.Call)
                          and isinstance(node.func, ast.Name)
                          and node.func.id == "print"
                      ):
                          yield RuleViolation(
                              context.filename,
                              node.lineno,
                              node.col_offset,
                              self.code,
                              self.description,
                          )

          def register_rules(registry: RuleRegistry) -> None:
              registry.register(NoPrintRule(), provider="my_project.lint_rules")
          PY
          cat > "$tmpdir/custom/example.py" <<'PY'
          print("hello")
          PY
          set +e
          PYTHONPATH="$tmpdir/custom" "$tmpdir/venv/bin/flakeforge" check --rule-module my_project.lint_rules --select ACME001 "$tmpdir/custom/example.py"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected custom-rule exit code 1, got $status" >&2
            exit 1
          fi

          cat > "$tmpdir/provider_pkg/pyproject.toml" <<'TOML'
          [build-system]
          requires = ["setuptools>=69", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "flakeforge-provider-smoke"
          version = "0.0.0"

          [project.entry-points."flakeforge.rules"]
          provider_smoke = "provider_rules:register_rules"
          TOML
          cat > "$tmpdir/provider_pkg/provider_rules/__init__.py" <<'PY'
          import ast
          from flakeforge import RuleContext, RuleRegistry, RuleViolation

          class ProviderRule:
              code = "VEND001"
              description = "Do not call print() in provider smoke test."

              def check(self, context: RuleContext):
                  for node in ast.walk(context.tree):
                      if (
                          isinstance(node, ast.Call)
                          and isinstance(node.func, ast.Name)
                          and node.func.id == "print"
                      ):
                          yield RuleViolation(
                              context.filename,
                              node.lineno,
                              node.col_offset,
                              self.code,
                              self.description,
                          )

          def register_rules(registry: RuleRegistry) -> None:
              registry.register(ProviderRule(), provider="provider_rules")
          PY
          "$tmpdir/venv/bin/pip" install "$tmpdir/provider_pkg"
          set +e
          "$tmpdir/venv/bin/flakeforge" check --select VEND001 "$tmpdir/custom/example.py"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected installed-provider exit code 1, got $status" >&2
            exit 1
          fi

          cat > "$tmpdir/broad_exception.py" <<'PY'
          def handler() -> int:
              """Handle a broad exception."""
              try:
                  risky()
              except Exception:
                  return 1
          PY
          set +e
          "$tmpdir/venv/bin/python" -m flake8 --select X002 "$tmpdir/broad_exception.py"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected flake8 plugin exit code 1, got $status" >&2
            exit 1
          fi

          # --- Standalone CLI scenarios (run from a cwd OUTSIDE the fixture) ---
          # The commands below stay in the checkout root and pass absolute target
          # paths, so config discovery must anchor on the target, not the cwd.
          mkdir -p \
            "$tmpdir/anchored/proj" \
            "$tmpdir/cli_params/proj" \
            "$tmpdir/local_rules/proj/proj_rules"

          # Scenario 1 (G1): the target's own flakeforge.toml is honored even
          # though flakeforge is invoked from outside the project. The config
          # ignores X005 -- the only code app.py would trigger -- so a run that
          # honors it is clean (exit 0); the default all-rules run would exit 1.
          cat > "$tmpdir/anchored/proj/app.py" <<'PY'
          def greet(name: str) -> str:
              return name
          PY
          cat > "$tmpdir/anchored/proj/flakeforge.toml" <<'TOML'
          ignore = ["X005"]
          TOML
          set +e
          "$tmpdir/venv/bin/flakeforge" check "$tmpdir/anchored/proj"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "expected anchored-config clean exit code 0, got $status" >&2
            exit 1
          fi

          # Scenario 2 (G2): a CLI-parameters-only config file passed via --config
          # (output_format, rule_plugins, select) is honored. select=["X005"]
          # fires on app.py, output_format="json" shapes stdout, exit code is 1.
          cat > "$tmpdir/cli_params/proj/app.py" <<'PY'
          def greet(name: str) -> str:
              return name
          PY
          cat > "$tmpdir/cli_params/ci.toml" <<'TOML'
          output_format = "json"
          rule_plugins = false
          select = ["X005"]
          TOML
          set +e
          out="$("$tmpdir/venv/bin/flakeforge" check --config "$tmpdir/cli_params/ci.toml" "$tmpdir/cli_params/proj" 2>/dev/null)"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected cli-params config exit code 1, got $status" >&2
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q '"files_checked"'; then
            echo "expected JSON output_format from the config file" >&2
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q '"code": "X005"'; then
            echo "expected X005 in the JSON payload" >&2
            exit 1
          fi

          # Scenario 3 (03): --no-config ignores the target's project config. The
          # same tree as scenario 1 (flakeforge.toml ignores X005) now reports
          # X005 because discovery is skipped and defaults enable every rule.
          set +e
          out="$("$tmpdir/venv/bin/flakeforge" check --no-config "$tmpdir/anchored/proj/app.py" 2>/dev/null)"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected --no-config exit code 1, got $status" >&2
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'X005'; then
            echo "expected X005 to fire once --no-config skips the project config" >&2
            exit 1
          fi

          # Scenario 4 (G4): a project-local rule_modules provider loads from a
          # project that is NOT installed and is NOT on PYTHONPATH. The loaded
          # config file vouches for its own directory, which is placed first on
          # sys.path only while the module imports (contract C7).
          cat > "$tmpdir/local_rules/proj/proj_rules/__init__.py" <<'PY'
          PY
          cat > "$tmpdir/local_rules/proj/proj_rules/lint_rules.py" <<'PY'
          import ast
          from flakeforge import RuleContext, RuleRegistry, RuleViolation

          class NoPrintRule:
              code = "ACME001"
              description = "Do not call print() in production code."

              def check(self, context: RuleContext):
                  for node in ast.walk(context.tree):
                      if (
                          isinstance(node, ast.Call)
                          and isinstance(node.func, ast.Name)
                          and node.func.id == "print"
                      ):
                          yield RuleViolation(
                              context.filename,
                              node.lineno,
                              node.col_offset,
                              self.code,
                              self.description,
                          )

          def register_rules(registry: RuleRegistry) -> None:
              registry.register(NoPrintRule(), provider="proj_rules.lint_rules")
          PY
          cat > "$tmpdir/local_rules/proj/app.py" <<'PY'
          print("hello")
          PY
          cat > "$tmpdir/local_rules/proj/flakeforge.toml" <<'TOML'
          rule_modules = ["proj_rules.lint_rules"]
          select = ["ACME001"]
          TOML
          set +e
          out="$("$tmpdir/venv/bin/flakeforge" check "$tmpdir/local_rules/proj" 2>/dev/null)"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected project-local rule_modules exit code 1, got $status" >&2
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'ACME001'; then
            echo "expected ACME001 from an uninstalled, non-PYTHONPATH rule module" >&2
            exit 1
          fi

          # --- Config precedence matrix (02.0/04) ---
          # Runs from the checkout root (cwd OUTSIDE each fixture) with absolute
          # targets, so discovery anchors on the target (C4). Every winning
          # config ignores X001 -- the only code app.py triggers under
          # --select X001 -- so an honored config is clean (0) and a skipped or
          # overridden config lets the bare except fire (1).
          mkdir -p \
            "$tmpdir/prec/ff/proj" \
            "$tmpdir/prec/pyproj/proj" \
            "$tmpdir/prec/legacy/proj" \
            "$tmpdir/prec/shadow/proj" \
            "$tmpdir/prec/nested/proj/pkg"

          # A: a discovered flakeforge.toml that ignores X001 -> clean (exit 0).
          cat > "$tmpdir/prec/ff/proj/app.py" <<'PY'
          def f():
              try:
                  run()
              except:
                  return 1
          PY
          cat > "$tmpdir/prec/ff/proj/flakeforge.toml" <<'TOML'
          ignore = ["X001"]
          TOML
          set +e
          "$tmpdir/venv/bin/flakeforge" check --select X001 "$tmpdir/prec/ff/proj"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "expected flakeforge.toml discovery clean exit 0, got $status" >&2
            exit 1
          fi

          # B: a discovered pyproject.toml [tool.flakeforge] -> clean (exit 0).
          cat > "$tmpdir/prec/pyproj/proj/app.py" <<'PY'
          def f():
              try:
                  run()
              except:
                  return 1
          PY
          cat > "$tmpdir/prec/pyproj/proj/pyproject.toml" <<'TOML'
          [tool.flakeforge]
          ignore = ["X001"]
          TOML
          set +e
          "$tmpdir/venv/bin/flakeforge" check --select X001 "$tmpdir/prec/pyproj/proj"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "expected pyproject [tool.flakeforge] discovery clean exit 0, got $status" >&2
            exit 1
          fi

          # C: legacy [tool.flake8_lint] still governs, with a deprecation warning.
          cat > "$tmpdir/prec/legacy/proj/app.py" <<'PY'
          def f():
              try:
                  run()
              except:
                  return 1
          PY
          cat > "$tmpdir/prec/legacy/proj/pyproject.toml" <<'TOML'
          [tool.flake8_lint]
          ignore = ["X001"]
          TOML
          set +e
          "$tmpdir/venv/bin/flakeforge" check --select X001 "$tmpdir/prec/legacy/proj" 2>"$tmpdir/prec/legacy.err"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "expected legacy [tool.flake8_lint] clean exit 0, got $status" >&2
            exit 1
          fi
          if ! grep -q 'deprecated' "$tmpdir/prec/legacy.err"; then
            echo "expected a deprecation warning for [tool.flake8_lint]" >&2
            exit 1
          fi

          # D: same-directory shadow -> flakeforge.toml wins, exactly one warning.
          cat > "$tmpdir/prec/shadow/proj/app.py" <<'PY'
          def f():
              try:
                  run()
              except:
                  return 1
          PY
          cat > "$tmpdir/prec/shadow/proj/flakeforge.toml" <<'TOML'
          ignore = ["X001"]
          TOML
          cat > "$tmpdir/prec/shadow/proj/pyproject.toml" <<'TOML'
          [tool.flakeforge]
          select = []
          TOML
          set +e
          "$tmpdir/venv/bin/flakeforge" check --select X001 "$tmpdir/prec/shadow/proj" 2>"$tmpdir/prec/shadow.err"
          status=$?
          shadow_count="$(grep -c 'is shadowed by flakeforge.toml' "$tmpdir/prec/shadow.err")"
          set -e
          if [ "$status" -ne 0 ]; then
            echo "expected same-dir shadow clean exit 0, got $status" >&2
            exit 1
          fi
          if [ "$shadow_count" -ne 1 ]; then
            echo "expected exactly one shadow warning, got $shadow_count" >&2
            exit 1
          fi

          # E: parent/child nesting -> the nearest pyproject wins and does NOT
          # ignore X001, so the parent flakeforge.toml is never consulted (exit 1).
          cat > "$tmpdir/prec/nested/proj/pkg/app.py" <<'PY'
          def f():
              try:
                  run()
              except:
                  return 1
          PY
          cat > "$tmpdir/prec/nested/proj/flakeforge.toml" <<'TOML'
          ignore = ["X001"]
          TOML
          cat > "$tmpdir/prec/nested/proj/pkg/pyproject.toml" <<'TOML'
          [tool.flakeforge]
          select = []
          TOML
          set +e
          "$tmpdir/venv/bin/flakeforge" check --select X001 "$tmpdir/prec/nested/proj/pkg"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected nearest-config exit 1 (parent not consulted), got $status" >&2
            exit 1
          fi

          # F: --config overrides discovery -> parent flakeforge.toml wins (exit 0).
          set +e
          "$tmpdir/venv/bin/flakeforge" check --config "$tmpdir/prec/nested/proj/flakeforge.toml" --select X001 "$tmpdir/prec/nested/proj/pkg"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "expected --config override clean exit 0, got $status" >&2
            exit 1
          fi

          # G: --no-config skips the discovered flakeforge.toml -> X001 fires (exit 1).
          set +e
          "$tmpdir/venv/bin/flakeforge" check --no-config --select X001 "$tmpdir/prec/ff/proj"
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected --no-config exit 1 (config skipped), got $status" >&2
            exit 1
          fi

          # Introspection & bootstrap (task 03.0): init writes a config that
          # config show and rules then read; bad invocations exit 2.
          mkdir -p "$tmpdir/boot"
          "$tmpdir/venv/bin/flakeforge" init "$tmpdir/boot"
          test -f "$tmpdir/boot/flakeforge.toml"
          set +e
          "$tmpdir/venv/bin/flakeforge" init "$tmpdir/boot"
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected repeated init to refuse with exit 2, got $status" >&2
            exit 1
          fi
          "$tmpdir/venv/bin/flakeforge" config show --output-format json "$tmpdir/boot" | grep -q '"discovery_anchor"'
          "$tmpdir/venv/bin/flakeforge" rules --no-rule-plugins "$tmpdir/boot" | grep -q '^X001 '
          set +e
          "$tmpdir/venv/bin/flakeforge" config
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected bare 'config' exit 2, got $status" >&2
            exit 1
          fi
