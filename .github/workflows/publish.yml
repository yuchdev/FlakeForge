name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run tests
        run: pytest --cov=flakeforge --cov-report=term-missing
      - name: Run Ruff
        run: ruff check .
      - name: Run flakeforge self-check subset
        run: python -m flakeforge check --select X001,X009,X010 src
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  wheel-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4.1.3
        with:
          name: python-dist
          path: dist
      - name: Smoke test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python -m venv "$tmpdir/venv"
          "$tmpdir/venv/bin/pip" install --upgrade pip
          "$tmpdir/venv/bin/pip" install dist/*.whl
          # The wheel filename carries the built version: flakeforge-<version>-py3-none-any.whl.
          wheel_version="$(basename dist/*.whl | cut -d- -f2)"
          "$tmpdir/venv/bin/flakeforge" --version | grep -Fx "flakeforge $wheel_version"

  publish:
    runs-on: ubuntu-latest
    needs: [build, wheel-smoke]
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
