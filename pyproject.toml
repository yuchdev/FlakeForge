[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flakeforge"
version = "1.0.0"
description = "Reusable AST-based Python lint rules with CLI, Flake8 adapter, and pytest helper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yurii Cherkasov" }]
keywords = ["flake8", "lint", "ast", "python", "pytest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build",
  "flake8",
  "pytest",
  "pytest-cov",
  "release-saga==1.2.0",
  "ruff",
  "twine",
]

[project.scripts]
flakeforge = "flakeforge.cli:main"

[project.entry-points."flake8.extension"]
X0 = "flakeforge.plugin:ProjectRulesPlugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["flakeforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.flakeforge]
include = ["src/flakeforge"]
exclude = []
select = []
ignore = []
allow_noqa = true
noqa_allowed = []
noqa_forbidden = []
rule_modules = []

[tool.release-saga]
s3_bucket = "packages-s3-useast1-any"
s3_prefix = "{package_name_dash}/"
git_tag_template = "release.{version}"
